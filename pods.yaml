defaults:
  build: website
  run: website
  update: website

images:
  website:
    tag: photos-website:latest
    from: Containerfile.dev

development:
  website:
    name: photos-website
    image: photos-website:latest
    ports:
      4300: 4000
    args:
      - --future

  publish:
    name: publish
    image: photos-website:latest
    bind_mounts:
      scripts/publish.rb: /bin/publish.rb
      _drafts: /drafts
      _posts: /posts
      photos: /photos
    entrypoint:
      - ruby
      - /bin/publish.rb
