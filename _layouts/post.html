---
layout: page
---

{% assign post=page %}
{% include post.html %}

<div class="post-footer">
  <p>
    {% if page.next.url %}
      <a href="{{ page.next.url }}">&larr;&nbsp;Next</a> |
    {% endif %}
    <a href="{{ post | random_post_link: site.posts }}">Random</a>
    {% if page.previous.url %}|{% endif %}
    {% if page.previous.url %}
      <a href="{{ page.previous.url }}">Previous&nbsp;&rarr;</a>
    {% endif %}
  </p>
</div>
